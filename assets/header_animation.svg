<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes fadeUp { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes pulseB { 0%,100% { stroke-opacity:.3; } 50% { stroke-opacity:1; } }
      @keyframes pulseG { 0%,100% { stroke-opacity:.3; } 50% { stroke-opacity:1; } }
      @keyframes pulseE { 0%,100% { stroke-opacity:.3; } 50% { stroke-opacity:1; } }
      @keyframes pulseP { 0%,100% { stroke-opacity:.3; } 50% { stroke-opacity:1; } }
      @keyframes scan { 0% { transform:translateY(-35px); } 100% { transform:translateY(300px); } }
      .a1{animation:fadeUp .6s ease-out .1s both;}
      .a2{animation:fadeUp .6s ease-out .6s both;}
      .a3{animation:fadeUp .6s ease-out 1.1s both;}
      .a4{animation:fadeUp .6s ease-out 1.5s both;}
      .m1{animation:fadeUp .5s ease-out 2.0s both;}
      .m2{animation:fadeUp .5s ease-out 2.3s both;}
      .m3{animation:fadeUp .5s ease-out 2.6s both;}
      .m4{animation:fadeUp .5s ease-out 2.9s both;}
      .cursor{animation:blink .9s step-end infinite;fill:#3B82F6;}
      .bb{animation:pulseB 2.4s ease-in-out infinite;}
      .bg{animation:pulseG 2.4s ease-in-out .6s infinite;}
      .be{animation:pulseE 2.4s ease-in-out 1.2s infinite;}
      .bp{animation:pulseP 2.4s ease-in-out 1.8s infinite;}
      .sc{animation:scan 5s linear infinite;}
    </style>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0D1117"/><stop offset="100%" stop-color="#0B1120"/></linearGradient>
    <linearGradient id="rbG" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1D4ED8"/><stop offset="33%" stop-color="#7C3AED"/><stop offset="66%" stop-color="#059669"/><stop offset="100%" stop-color="#D97706"/></linearGradient>
    <filter id="tf"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="tc"><rect x="0" y="80" height="50" width="0"><animate attributeName="width" from="0" to="900" dur="1s" fill="freeze" begin=".6s"/></rect></clipPath>
    <clipPath id="sc2"><rect x="0" y="130" height="28" width="0"><animate attributeName="width" from="0" to="900" dur=".8s" fill="freeze" begin="1.1s"/></rect></clipPath>
  </defs>
  <rect width="900" height="300" fill="url(#bgG)" rx="12"/>
  <g opacity=".04" stroke="#94A3B8" stroke-width=".5">
    <line x1="150" y1="0" x2="150" y2="300"/><line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="450" y1="0" x2="450" y2="300"/><line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="750" y1="0" x2="750" y2="300"/><line x1="0" y1="75" x2="900" y2="75"/>
    <line x1="0" y1="150" x2="900" y2="150"/><line x1="0" y1="225" x2="900" y2="225"/>
  </g>
  <rect class="sc" width="900" height="32" fill="white" opacity=".018" y="0"/>
  <rect x="0" y="0" height="4" fill="url(#rbG)" rx="2" width="0"><animate attributeName="width" from="0" to="900" dur=".7s" fill="freeze"/></rect>
  <rect x="1" y="1" width="898" height="298" rx="11" fill="none" stroke="#1E3A8A" stroke-width="1.5" class="bb"/>
  <g fill="none" stroke="#1E3A8A" stroke-width="1.5" opacity=".6">
    <path d="M12,34 L12,12 L34,12"/><path d="M866,12 L888,12 L888,34"/>
    <path d="M12,266 L12,288 L34,288"/><path d="M866,288 L888,288 L888,266"/>
  </g>
  <text x="46" y="115" font-size="50" class="a1">&#x26A1;</text>
  <text x="108" y="72" font-family="'Courier New',monospace" font-size="11" fill="#475569" letter-spacing="3" class="a1">INDUSTRIAL EDGE AI/ML &#x00B7; REAL-TIME DETECTION</text>
  <text x="108" y="113" font-family="'Courier New',monospace" font-size="30" font-weight="bold" fill="#F1F5F9" filter="url(#tf)" clip-path="url(#tc)">Dead-Cycle Time Optimizer</text>
  <text x="656" y="113" font-family="'Courier New',monospace" font-size="30" font-weight="bold" class="cursor">|</text>
  <text x="108" y="142" font-family="sans-serif" font-size="13" fill="#94A3B8" clip-path="url(#sc2)">Page&#x2019;s CUSUM + SPRT &#x00B7; Multi-Tier Fusion &#x00B7; 15&#x2013;50 MN Hydraulic Presses &#x00B7; OPC-UA IEC 62541</text>
  <line x1="108" y1="160" x2="108" y2="160" stroke="#1E293B" stroke-width="1"><animate attributeName="x2" from="108" to="855" dur=".6s" fill="freeze" begin="1.5s"/></line>
  <g class="a4" font-family="monospace" font-size="9" fill="#94A3B8">
    <rect x="108" y="170" width="115" height="19" rx="4" fill="#0F172A" stroke="#1E3A5F" stroke-width="1"/><text x="165" y="183" text-anchor="middle">Python 3.11 / 3.12</text>
    <rect x="232" y="170" width="96" height="19" rx="4" fill="#0F172A" stroke="#1E3A5F" stroke-width="1"/><text x="280" y="183" text-anchor="middle">MIT License</text>
    <rect x="337" y="170" width="130" height="19" rx="4" fill="#0F172A" stroke="#1E3A5F" stroke-width="1"/><text x="402" y="183" text-anchor="middle">600-Cycle Benchmark</text>
    <rect x="476" y="170" width="118" height="19" rx="4" fill="#0F172A" stroke="#1E3A5F" stroke-width="1"/><text x="535" y="183" text-anchor="middle">18 Tests Passing</text>
    <rect x="603" y="170" width="118" height="19" rx="4" fill="#0F172A" stroke="#1E3A5F" stroke-width="1"/><text x="662" y="183" text-anchor="middle">Edge-Native &#x00B7; No Cloud</text>
  </g>
  <!-- Card 1 Precision -->
  <g class="m1">
    <rect x="108" y="204" width="168" height="78" rx="8" fill="#080F1A" stroke="#1E3A8A" stroke-width="1.5" class="bb"/>
    <rect x="108" y="204" width="168" height="4" rx="2" fill="#2563EB"/>
    <text x="192" y="223" text-anchor="middle" font-family="monospace" font-size="9" fill="#475569" letter-spacing="1.5">PRECISION</text>
    <text x="192" y="254" text-anchor="middle" font-family="'Courier New',monospace" font-size="28" font-weight="bold" fill="#3B82F6" filter="url(#tf)">95.42%</text>
    <text x="192" y="270" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#475569">Page&#x2019;s CUSUM (SPRT-grounded)</text>
  </g>
  <!-- Card 2 Recall -->
  <g class="m2">
    <rect x="288" y="204" width="168" height="78" rx="8" fill="#080F1A" stroke="#14532D" stroke-width="1.5" class="bg"/>
    <rect x="288" y="204" width="168" height="4" rx="2" fill="#059669"/>
    <text x="372" y="223" text-anchor="middle" font-family="monospace" font-size="9" fill="#475569" letter-spacing="1.5">RECALL</text>
    <text x="372" y="254" text-anchor="middle" font-family="'Courier New',monospace" font-size="28" font-weight="bold" fill="#10B981" filter="url(#tf)">98.65%</text>
    <text x="372" y="270" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#475569">Fused: CUSUM + CPD + HMM</text>
  </g>
  <!-- Card 3 FPR -->
  <g class="m3">
    <rect x="468" y="204" width="168" height="78" rx="8" fill="#080F1A" stroke="#14532D" stroke-width="1.5" class="be"/>
    <rect x="468" y="204" width="168" height="4" rx="2" fill="#10B981"/>
    <text x="552" y="223" text-anchor="middle" font-family="monospace" font-size="9" fill="#475569" letter-spacing="1.5">FALSE ALARM RATE</text>
    <text x="552" y="254" text-anchor="middle" font-family="'Courier New',monospace" font-size="28" font-weight="bold" fill="#10B981" filter="url(#tf)">0.33%</text>
    <text x="552" y="270" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#475569">&#x2212;61% vs. Rolling MAD baseline</text>
  </g>
  <!-- Card 4 Tests -->
  <g class="m4">
    <rect x="648" y="204" width="168" height="78" rx="8" fill="#080F1A" stroke="#3B0764" stroke-width="1.5" class="bp"/>
    <rect x="648" y="204" width="168" height="4" rx="2" fill="#7C3AED"/>
    <text x="732" y="223" text-anchor="middle" font-family="monospace" font-size="9" fill="#475569" letter-spacing="1.5">TEST SUITE</text>
    <text x="732" y="254" text-anchor="middle" font-family="'Courier New',monospace" font-size="28" font-weight="bold" fill="#A78BFA" filter="url(#tf)">18 / 18</text>
    <text x="732" y="270" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#475569">All Passing &#x00B7; ~68 s runtime</text>
  </g>
  <rect x="0" y="296" height="4" fill="url(#rbG)" rx="2" width="0"><animate attributeName="width" from="0" to="900" dur=".7s" fill="freeze" begin="3.2s"/></rect>
</svg>
